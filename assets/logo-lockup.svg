<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-labelledby="title description">
  <title id="title">JobFinder</title>
  <desc id="description">Multiple job-board results merge into one focused shortlist.</desc>
  <style>
    .word { fill: #181A27; }
    .finder { fill: #564BEA; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #F2F3FF; }
      .finder { fill: #9A94FF; }
    }
  </style>
  <defs>
    <linearGradient id="lockup-gradient" x1="5" y1="3" x2="49" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#4C42D5"/>
    </linearGradient>
  </defs>
  <g transform="translate(2 2)">
    <rect width="60" height="60" rx="18" fill="url(#lockup-gradient)"/>
    <path
      d="M16 16.5h22M16 26h22M16 35.5h22M38 16.5v20c0 7.1-4.9 11-12 11h-6"
      fill="none"
      stroke="#fff"
      stroke-width="4.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="19.5" cy="47.5" r="3.1" fill="#54E6CC"/>
  </g>
  <text class="word" x="78" y="42" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760" letter-spacing="-1.5">
    Job<tspan class="finder">Finder</tspan>
  </text>
</svg>
