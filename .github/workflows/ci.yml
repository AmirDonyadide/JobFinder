name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check
        run: python -m mypy src

      - name: Compile Python files
        run: python -m compileall src tests scripts

      - name: Smoke-test CLIs
        run: |
          jobfinder --help
          phdfinder --help
          jobfinder-scrape --help
          jobfinder-evaluate --help

      - name: Validate JSON config
        run: |
          python -m json.tool products/jobfinder/config/filters.json
          python -m json.tool products/phdfinder/config/filters.json

      - name: Test
        run: python -m pytest
