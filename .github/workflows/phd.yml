name: PhDFinder Pipeline

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Job sources to scrape"
        required: true
        default: "all"
        type: choice
        options:
          - linkedin
          - indeed
          - stepstone
          - xing
          - all
      posted_time_window:
        description: "Provider posted-time window"
        required: true
        default: "last_7d"
        type: choice
        options:
          - since_previous_run
          - last_24h
          - last_7d
          - backfill
      run_mode:
        description: "Pipeline mode"
        required: true
        default: "scrape_and_evaluate"
        type: choice
        options:
          - scrape_and_evaluate
          - scrape_only
      cv_pdf_output:
        description: "Generate tailored academic CV PDFs"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Intentionally manual-only until a verified run establishes acceptable
# Apify/OpenAI cost. Add a schedule here when recurring execution is desired.

permissions:
  actions: read
  contents: read

concurrency:
  group: phdfinder-pipeline
  cancel-in-progress: false

jobs:
  run-phdfinder:
    name: Run PhDFinder academic pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: phdfinder

    env:
      JOBFINDER_PROFILE: phd
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PHDFINDER_GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      PHDFINDER_CV_DRIVE_FOLDER_ID: ${{ secrets.JOB_EVAL_CV_DRIVE_FOLDER_ID }}
      JOB_KEYWORDS_TEXT: ${{ secrets.JOB_KEYWORDS_TEXT }}
      MASTER_PROMPT_TEXT: ${{ secrets.MASTER_PROMPT_TEXT }}
      MASTER_CV_TEX: ${{ secrets.MASTER_CV_TEX }}
      CV_PHOTO_BASE64: ${{ secrets.CV_PHOTO_BASE64 }}
      JOBFINDER_SCRAPER_OUTPUT_MODE: google_sheets
      JOBFINDER_SCRAPER_SOURCES: ${{ inputs.sources }}
      JOBFINDER_PIPELINE_MODE: ${{ inputs.run_mode }}
      JOBFINDER_PIPELINE_RESUME_INCOMPLETE: "true"
      JOBFINDER_SCRAPER_POSTED_TIME_WINDOW: ${{ inputs.posted_time_window }}
      JOBFINDER_SCRAPER_MAX_APPLICANTS: "0"
      JOBFINDER_SCRAPER_SEARCH_CONCURRENCY: "15"
      JOBFINDER_SCRAPER_SEARCH_WINDOW_BUFFER_SECONDS: "3600"
      JOBFINDER_SCRAPER_TIMEZONE: Europe/Berlin
      JOBFINDER_SCRAPER_POSTED_TIMEZONE: Europe/Berlin
      JOB_EVAL_OPENAI_MODEL: gpt-5-mini
      JOB_EVAL_CONCURRENCY: "8"
      JOB_EVAL_BATCH_SIZE: "40"
      JOB_EVAL_CV_PDF_OUTPUT: ${{ inputs.cv_pdf_output }}
      JOB_EVAL_CV_PHOTO_FILE: profiles/phd/photo.png
      JOB_EVAL_CV_MAX_PAGES: "2"
      JOB_EVAL_CV_PDF_TIMEOUT: "120"
      JOB_EVAL_UNSUITABLE_ROW_POLICY: keep_all
      JOBFINDER_PIPELINE_REPORT_FILE: reports/phdfinder-preflight.json
      JOBFINDER_SCRAPER_REPORT_FILE: reports/phdfinder-scraper.json
      JOBFINDER_EVALUATOR_REPORT_FILE: reports/phdfinder-evaluator.json
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-scraper.txt
            requirements-evaluator.txt
            requirements-google.txt

      - name: Install scraper and Google dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-scraper.txt
          python -m pip install -r requirements-google.txt

      - name: Install evaluator dependencies
        if: inputs.run_mode == 'scrape_and_evaluate'
        run: python -m pip install -r requirements-evaluator.txt

      - name: Install LaTeX tools
        if: inputs.run_mode == 'scrape_and_evaluate' && inputs.cv_pdf_output == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra

      - name: Validate PhDFinder environment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in APIFY_API_TOKEN PHDFINDER_GOOGLE_SPREADSHEET_ID GOOGLE_TOKEN_JSON JOB_KEYWORDS_TEXT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing ${name} in the phdfinder GitHub Environment."
              missing=1
            fi
          done

          if [ "${JOBFINDER_PIPELINE_MODE}" = "scrape_and_evaluate" ]; then
            for name in OPENAI_API_KEY MASTER_PROMPT_TEXT MASTER_CV_TEX; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Missing ${name} in the phdfinder GitHub Environment."
                missing=1
              fi
            done
          fi

          if [ "${JOBFINDER_PIPELINE_MODE}" = "scrape_and_evaluate" ] && \
             [ "${JOB_EVAL_CV_PDF_OUTPUT}" = "true" ] && \
             [ -z "${PHDFINDER_CV_DRIVE_FOLDER_ID}" ]; then
            echo "::error::Missing JOB_EVAL_CV_DRIVE_FOLDER_ID in the phdfinder GitHub Environment."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Write private PhDFinder inputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path

          profile_dir = Path("profiles/phd")
          profile_dir.mkdir(parents=True, exist_ok=True)
          (profile_dir / "keywords.txt").write_text(
              os.environ["JOB_KEYWORDS_TEXT"].strip() + "\n",
              encoding="utf-8",
          )

          if os.environ["JOBFINDER_PIPELINE_MODE"] == "scrape_and_evaluate":
              (profile_dir / "master_prompt.txt").write_text(
                  os.environ["MASTER_PROMPT_TEXT"].strip() + "\n",
                  encoding="utf-8",
              )
              (profile_dir / "master_cv.tex").write_text(
                  os.environ["MASTER_CV_TEX"].strip() + "\n",
                  encoding="utf-8",
              )

          token_json = os.environ["GOOGLE_TOKEN_JSON"].strip()
          try:
              token = json.loads(token_json)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"GOOGLE_TOKEN_JSON is not valid JSON: {exc}") from exc
          required = ("client_id", "client_secret", "refresh_token")
          if token.get("type") != "authorized_user" and not all(
              token.get(name) for name in required
          ):
              raise SystemExit("GOOGLE_TOKEN_JSON is not an authorized-user token.")

          Path("google_token.json").write_text(token_json, encoding="utf-8")
          (profile_dir / "google_spreadsheet_id.txt").write_text(
              os.environ["PHDFINDER_GOOGLE_SPREADSHEET_ID"].strip(),
              encoding="utf-8",
          )

          photo = "".join(os.environ.get("CV_PHOTO_BASE64", "").split())
          if photo and os.environ.get("JOB_EVAL_CV_PDF_OUTPUT") == "true":
              try:
                  photo_bytes = base64.b64decode(photo, validate=True)
              except binascii.Error as exc:
                  raise SystemExit(f"CV_PHOTO_BASE64 is not valid base64: {exc}") from exc
              (profile_dir / "photo.png").write_bytes(photo_bytes)
          PY

          chmod 600 google_token.json profiles/phd/google_spreadsheet_id.txt

      - name: Preflight PhDFinder configuration and access
        run: python -u run_job_pipeline.py --profile phd --mode "${JOBFINDER_PIPELINE_MODE}" --preflight

      - name: Run PhDFinder
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -u run_job_pipeline.py \
            --profile phd \
            --mode "${JOBFINDER_PIPELINE_MODE}" \
            2>&1 | tee phdfinder.log

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "# PhDFinder Run Summary"
            echo
            echo "- Profile: phd"
            echo "- Pipeline mode: ${JOBFINDER_PIPELINE_MODE}"
            echo "- Sources: ${JOBFINDER_SCRAPER_SOURCES}"
            echo "- Posted-time window: ${JOBFINDER_SCRAPER_POSTED_TIME_WINDOW}"
            echo "- CV PDF output: ${JOB_EVAL_CV_PDF_OUTPUT}"
            echo "- GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > reports/phdfinder-summary.md

      - name: Upload PhDFinder reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phdfinder-run-reports
          path: |
            reports/*.json
            reports/*.md
            phdfinder.log
          if-no-files-found: ignore

      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          rm -f \
            profiles/phd/keywords.txt \
            profiles/phd/master_prompt.txt \
            profiles/phd/master_cv.tex \
            profiles/phd/photo.png \
            profiles/phd/google_spreadsheet_id.txt \
            google_token.json \
            phdfinder.log
          rm -rf reports
