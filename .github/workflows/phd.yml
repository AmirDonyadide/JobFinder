name: PhDFinder Pipeline

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Job sources to scrape"
        required: true
        default: "all"
        type: choice
        options:
          - linkedin
          - indeed
          - stepstone
          - xing
          - all
      posted_time_window:
        description: "Provider posted-time window"
        required: true
        default: "last_7d"
        type: choice
        options:
          - since_previous_run
          - last_24h
          - last_7d
          - backfill
      run_mode:
        description: "Pipeline mode"
        required: true
        default: "scrape_and_evaluate"
        type: choice
        options:
          - scrape_and_evaluate
          - scrape_only
      cv_pdf_output:
        description: "Generate tailored academic CV PDFs"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Intentionally manual-only until a verified run establishes acceptable
# Apify/OpenAI cost. Add a schedule here when recurring execution is desired.

permissions:
  actions: read
  contents: read

concurrency:
  group: phdfinder-pipeline
  cancel-in-progress: false

jobs:
  run-phdfinder:
    name: Run PhDFinder academic pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: phdfinder

    env:
      JOBFINDER_PRODUCT: phd
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PHDFINDER_GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      PHDFINDER_CV_DRIVE_FOLDER_ID: ${{ secrets.JOB_EVAL_CV_DRIVE_FOLDER_ID }}
      JOB_KEYWORDS_TEXT: ${{ secrets.JOB_KEYWORDS_TEXT }}
      MASTER_PROMPT_TEXT: ${{ secrets.MASTER_PROMPT_TEXT }}
      MASTER_CV_TEX: ${{ secrets.MASTER_CV_TEX }}
      CV_PHOTO_BASE64: ${{ secrets.CV_PHOTO_BASE64 }}
      JOBFINDER_SCRAPER_OUTPUT_MODE: google_sheets
      JOBFINDER_SCRAPER_SOURCES: ${{ inputs.sources }}
      JOBFINDER_PIPELINE_MODE: ${{ inputs.run_mode }}
      JOBFINDER_PIPELINE_RESUME_INCOMPLETE: "true"
      JOBFINDER_SCRAPER_POSTED_TIME_WINDOW: ${{ inputs.posted_time_window }}
      JOBFINDER_SCRAPER_MAX_APPLICANTS: "0"
      JOBFINDER_SCRAPER_SEARCH_CONCURRENCY: "15"
      JOBFINDER_SCRAPER_SEARCH_WINDOW_BUFFER_SECONDS: "3600"
      JOBFINDER_SCRAPER_TIMEZONE: Europe/Berlin
      JOBFINDER_SCRAPER_POSTED_TIMEZONE: Europe/Berlin
      JOB_EVAL_OPENAI_MODEL: gpt-5-mini
      JOB_EVAL_CONCURRENCY: "8"
      JOB_EVAL_BATCH_SIZE: "40"
      JOB_EVAL_CV_PDF_OUTPUT: ${{ inputs.cv_pdf_output }}
      JOB_EVAL_CV_PHOTO_FILE: products/phdfinder/evaluator/photo.png
      JOB_EVAL_CV_MAX_PAGES: "2"
      JOB_EVAL_CV_PDF_TIMEOUT: "120"
      JOB_EVAL_UNSUITABLE_ROW_POLICY: keep_all
      JOBFINDER_PIPELINE_REPORT_FILE: reports/phdfinder-preflight.json
      JOBFINDER_SCRAPER_REPORT_FILE: reports/phdfinder-scraper.json
      JOBFINDER_EVALUATOR_REPORT_FILE: reports/phdfinder-evaluator.json
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scraper and Google dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[scraper]"
          python -m pip install -e ".[google]"

      - name: Install evaluator dependencies
        if: inputs.run_mode == 'scrape_and_evaluate'
        run: python -m pip install -e ".[evaluator]"

      - name: Install LaTeX tools
        if: inputs.run_mode == 'scrape_and_evaluate' && inputs.cv_pdf_output == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra

      - name: Validate secrets and prepare private runtime files
        shell: bash
        run: PYTHONPATH=src python -m jobfinder.operations.runtime_files prepare

      - name: Preflight PhDFinder configuration and access
        run: phdfinder --mode "${JOBFINDER_PIPELINE_MODE}" --preflight

      - name: Run PhDFinder
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          phdfinder \
            --mode "${JOBFINDER_PIPELINE_MODE}" \
            2>&1 | tee phdfinder.log

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "# PhDFinder Run Summary"
            echo
            echo "- Product: PhDFinder"
            echo "- Pipeline mode: ${JOBFINDER_PIPELINE_MODE}"
            echo "- Sources: ${JOBFINDER_SCRAPER_SOURCES}"
            echo "- Posted-time window: ${JOBFINDER_SCRAPER_POSTED_TIME_WINDOW}"
            echo "- CV PDF output: ${JOB_EVAL_CV_PDF_OUTPUT}"
            echo "- GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > reports/phdfinder-summary.md

      - name: Upload PhDFinder reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phdfinder-run-reports
          path: |
            reports/*.json
            reports/*.md
            phdfinder.log
          if-no-files-found: ignore

      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          PYTHONPATH=src python -m jobfinder.operations.runtime_files cleanup
          rm -f phdfinder.log
          rm -rf reports
